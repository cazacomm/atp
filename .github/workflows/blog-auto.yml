name: Blog — article automatique

on:
  schedule:
    # Tous les lundis à 09:00 UTC (11:00 heure française en été, 10:00 en hiver)
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Exécution à blanc (aucun fichier écrit, aucun commit)"
        type: boolean
        default: false
      topic:
        description: "Forcer un numéro de sujet (vide = prochain sujet non traité)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install --upgrade openai

      - name: Générer l'article
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi
          python3 scripts/generate-article.py $ARGS
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case $CODE in
            0)  echo "::notice::Article généré." ;;
            78) echo "::notice::Aucun nouveau sujet à traiter — rien à publier." ;;
            *)  echo "::error::Échec de la génération (code $CODE)." ;;
          esac
          # 78 = arrêt propre : le job ne doit pas être marqué en échec
          if [ "$CODE" = "78" ]; then exit 0; fi
          exit $CODE

      - name: Commit et push
        if: steps.generate.outputs.code == '0' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucune modification à committer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml rss.xml
          git commit -m "chore(blog): article auto du $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
